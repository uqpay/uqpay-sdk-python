name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release_mode: ${{ startsWith(github.ref, 'refs/tags/v') }}
      release_tag: ${{ github.ref_name }}

  publish-pypi:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install upload tool
        run: python -m pip install twine

      - name: Check whether PyPI version already exists
        id: registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/uqpay/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected PyPI status: $STATUS" >&2
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.registry.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
