name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify release tag and version
        run: python check_release_version.py --tag "$GITHUB_REF_NAME"

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install project and build tools
        run: python -m pip install -e ".[dev]" twine

      - name: Run full test suite
        env:
          SKIP_INTEGRATION_TESTS: "true"
        run: pytest

      - name: Build distributions
        run: hatch build

      - name: Verify artifact version
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python check_release_version.py --tag "$GITHUB_REF_NAME" --wheel "$WHEEL"
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install upload tool
        run: python -m pip install twine

      - name: Check whether PyPI version already exists
        id: registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/uqpay/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected PyPI status: $STATUS" >&2
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.registry.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
